on: [push, pull_request, workflow_dispatch]

jobs:

  build:

    name: ${{ matrix.os }}

    runs-on: windows-latest

    strategy:
      matrix:
        lisp: [sbcl_static]
        os: [windows]

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v3

    - uses: msys2/setup-msys2@v2
      with:
        install: git curl zip gcc atool libzstd-devel mingw-w64-x86_64-zstd mingw-w64-x86_64-toolchain mingw-w64-x86_64-autotools mingw-w64-x86_64-cmake mingw-w64-x86_64-openssl mingw-w64-x86_64-github-cli

    - name: Check $PATH
      run: echo $PATH

    - name: Add $CORE and $REPL_CORE
      run: |
        echo "CORE=moonli-${{ github.ref_name }}.${{ matrix.os }}.$(uname -m)" >> $GITHUB_ENV
        echo "REPL_CORE=moonli-${{ github.ref_name }}.repl.${{ matrix.os }}.$(uname -m)" >> $GITHUB_ENV
        echo "CIEL_CORE=moonli-${{ github.ref_name }}.ciel.${{ matrix.os }}.$(uname -m)" >> $GITHUB_ENV

    - name: Download implementation
      env:
        LISP: ${{ matrix.lisp }}
        OS:   ${{ matrix.os }}
      run: |
        pwd
        ls -l
        bash --version
        bash <(curl -s https://raw.githubusercontent.com/digikar99/lisp-travis-lite/master/run.sh)

    - name: Download download-dependencies
      run: |
        git clone https://github.com/digikar99/download-dependencies $HOME/quicklisp/local-projects/download-dependencies

    - name: Download dependencies
      run: |
        pacman --noconfirm -S mingw-w64-x86_64-readline
        cl --eval '(ql:quickload "download-dependencies")' \
           --eval '(in-package :download-dependencies)' \
           --eval '(push "./" ql:*local-project-directories*)' \
           --eval '(let ((*dependencies-home* (second ql:*local-project-directories*))) (ensure-system "moonli/repl"))'
        ls $HOME/quicklisp/local-projects/

    - name: Compile isocline
      run: |
        pwd
        cd $HOME/quicklisp/local-projects/cl-isocline/isocline/
        mkdir -p build/release
        cd build/release
        cmake ../..
        cmake --build .

    - name: Statically link against libisocline + libcrypto, libssl
      run: |
        SBCL_DIR="sbcl-2.6.3+r00-x86-64-windows"
        SYS_LIBDIR="/mingw64/lib"
        LIBCRYPTO="${SYS_LIBDIR}/libcrypto.a ${SYS_LIBDIR}/libcrypt32.a"
        LIBSSL=${SYS_LIBDIR}/libssl.a
        LIBISOCLINE="$HOME/quicklisp/local-projects/cl-isocline/isocline/build/release/libisocline.a"
        export WHOLE_ARCHIVES="-Wl,--whole-archive $LIBSSL -Wl,--no-whole-archive $LIBCRYPTO -Wl,--whole-archive $LIBISOCLINE"
        cd "/home/runneradmin/$SBCL_DIR"
        make -C "src/runtime" -f binaries.mk sbcl.extras
        mv "src/runtime/sbcl.extras" "src/runtime/sbcl"
        
    - name: Prepare moonli
      run: |
        cl --eval '(push "./" ql:*local-project-directories*)' \
           --eval '(ql:quickload "moonli")' \
           --eval '(asdf:make "moonli")'
        mv moonli ${{ env.CORE }}.exe


    - name: Upload moonli
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.CORE }}.exe
        path: ${{ env.CORE }}.exe


    - name: Publish moonli
      if: startsWith(github.ref, 'refs/tags/')
      uses: SierraSoftworks/gh-releases@v1.0.4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        overwrite: 'true'
        files: ${{ env.CORE }}.exe


    - name: Prepare moonli-repl
      run: |
        cl --eval '(push "./" ql:*local-project-directories*)' \
           --eval '(ql:quickload "moonli/repl")' \
           --eval "(cffi:close-foreign-library 'isocline::libisocline)" \
           --eval '(asdf:make "moonli/repl")'
        mv moonli.repl.exe ${{ env.REPL_CORE }}.exe

    - name: Upload moonli-cl-repl
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.REPL_CORE }}.exe
        path: ${{ env.REPL_CORE }}.exe

    - name: Publish moonli-cl-repl
      if: startsWith(github.ref, 'refs/tags/')
      uses: SierraSoftworks/gh-releases@v1.0.4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        overwrite: 'true'
        files: ${{ env.REPL_CORE }}.exe


    - name: Install ultralisp
      run: cl --eval '(ql-dist:install-dist "http://dist.ultralisp.org/" :prompt nil)'

    - name: Prepare moonli-ciel
      if: startsWith(github.ref, 'refs/tags/')
      continue-on-error: true
      run: |
        cl --eval '(push "./" ql:*local-project-directories*)' \
           --eval '(ql:quickload "moonli/ciel")' \
           --eval "(cffi:close-foreign-library 'isocline::libisocline)" \
           --eval '(asdf:make "moonli/ciel")'
        mv moonli.ciel.exe ${{ env.CIEL_CORE }}.exe

    - name: Upload moonli-ciel
      if: startsWith(github.ref, 'refs/tags/')
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.CIEL_CORE }}.exe
        path: ${{ env.CIEL_CORE }}.exe


    - name: Publish moonli-ciel
      if: startsWith(github.ref, 'refs/tags/')
      continue-on-error: true
      uses: SierraSoftworks/gh-releases@v1.0.4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        overwrite: 'true'
        files: ${{ env.CIEL_CORE }}.exe
